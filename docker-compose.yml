version: "3.9"

services:
  api:
    build: .
    container_name: cloudly_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: python main.py --serve
    restart: unless-stopped

  streamlit:
    build: .
    container_name: cloudly_ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped